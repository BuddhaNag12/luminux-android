name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      internal_testing:
        description: Allow test AdMob IDs and empty Play license key (testing tracks only)
        type: boolean
        default: true
      version_code:
        description: Optional explicit versionCode (leave blank for GPP auto-bump)
        type: string
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Write signing keystore and Play credentials
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          printf 'storeFile=%s/upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE" "$UPLOAD_STORE_PASSWORD" "$UPLOAD_KEY_ALIAS" "$UPLOAD_KEY_PASSWORD" \
            > keystore.properties
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Publish release bundle to Google Play
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_INTERNAL: ${{ inputs.internal_testing }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ "$IS_DISPATCH" = "true" ]; then
            TRACK="$INPUT_TRACK"
            INTERNAL="$INPUT_INTERNAL"
          else
            TRACK="internal"
            INTERNAL="true"
          fi
          ARGS=(
            ":app:publishReleaseBundle"
            "-Pluminux.playTrack=$TRACK"
            "-Pluminux.internalTesting=$INTERNAL"
          )
          if [ -n "$INPUT_VERSION_CODE" ]; then
            ARGS+=("-Pluminux.versionCode=$INPUT_VERSION_CODE")
          fi
          if [ -n "$ADMOB_APP_ID" ]; then
            ARGS+=("-Pluminux.admobAppId=$ADMOB_APP_ID")
          fi
          if [ -n "$ADMOB_REWARDED_ID" ]; then
            ARGS+=("-Pluminux.admobRewardedId=$ADMOB_REWARDED_ID")
          fi
          if [ -n "$PLAY_LICENSE_KEY" ]; then
            ARGS+=("-Pluminux.playLicenseKey=$PLAY_LICENSE_KEY")
          fi
          ./gradlew "${ARGS[@]}"

      - name: Clean up secret files
        if: always()
        run: rm -f upload-keystore.jks keystore.properties play-service-account.json
